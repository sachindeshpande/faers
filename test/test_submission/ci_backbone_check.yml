# Sample CI step — Backbone Invariant Check
#
# Drop into .github/workflows/ in the workflow-app repo (or merge into an
# existing workflow file). Runs validate_backbone.py against the regression
# XML corpus on every PR.
#
# Why this gate exists:
#   - lint catches business-rule problems.
#   - golden regression catches drift relative to known-good outputs, but can
#     silently pass if both generator AND goldens drift in lockstep.
#   - this gate asserts the v37-proven structural backbone independently of
#     goldens, so a co-drift can never sneak through.
#
# Runtime: well under 5 seconds for the full 35-file corpus.

name: Backbone Invariant Check

on:
  pull_request:
    paths:
      - "src/xml/**"
      - "src/services/xmlGeneratorService.ts"
      - "test/golden/**"
      - "test/test_submission/validate_backbone.py"
      - ".github/workflows/backbone.yml"
  push:
    branches: [main]

jobs:
  backbone:
    runs-on: ubuntu-latest
    env:
      # Single source of truth for the MedDRA version the generator targets.
      # Bump in lockstep with the generator code so the gate tracks reality.
      FAERS_MEDDRA_VERSION: "25.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lxml
        run: pip install lxml

      # If the generator's output isn't already in the repo, regenerate it.
      # Skip this step if your CI already generates the corpus elsewhere.
      - name: Generate regression XMLs
        run: |
          python3 test/test_submission/golden_regression_test.py

      - name: Run backbone invariants
        run: |
          python3 test/test_submission/validate_backbone.py \
            --all test/test_submission/regression/xml/

      # Optional: also save a machine-readable report for downstream tooling
      # (PR comment bot, dashboards, etc.).
      - name: Generate JSON report
        if: always()
        run: |
          python3 test/test_submission/validate_backbone.py --json \
            --all test/test_submission/regression/xml/ \
            > backbone-report.json || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backbone-report
          path: backbone-report.json
          retention-days: 14

      # Optional: also run the canonical v37 reference file through the gate,
      # so any change that would have regressed v37 is caught immediately.
      # Skip if v37 reference is not stored in the repo.
      - name: Verify v37 canonical reference still passes
        if: hashFiles('test/test_submission/package/CASE-20260331-EMJQ_fixed_v37_patch.xml') != ''
        # The project is pinned to MedDRA 25.0 (matches v37 and the golden corpus),
        # so this passes the default. The flag is kept explicit so the v37 reference
        # check stays correct even if FAERS_MEDDRA_VERSION is bumped later.
        run: |
          python3 test/test_submission/validate_backbone.py \
            --meddra-version 25.0 \
            test/test_submission/package/CASE-20260331-EMJQ_fixed_v37_patch.xml
